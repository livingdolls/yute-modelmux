          \t\t},
          \t\tModels: []config.ModelConfig{
          \t\t\t{ID: "economy", ProviderID: "provider", ModelName: "economy-upstream", Strategy: "failover", Enabled: true, Capabilities: &config.ModelCapabilityConfig{Chat: groupFeatureBool(true), Streaming: groupFeatureBool(true), Tools: groupFeatureBool(false)}},
          \t\t\t{ID: "flagship", ProviderID: "provider", ModelName: "flagship-upstream", Strategy: "failover", Enabled: true, Capabilities: &config.ModelCapabilityConfig{Chat: groupFeatureBool(true), Streaming: groupFeatureBool(true), Tools: groupFeatureBool(true)}},
          \t\t},
          \t\tModelGroups: []config.ModelGroupConfig{
          \t\t\t{ID: "coding-balanced", Name: "Coding Balanced", Description: "Agent coding group", Strategy: "failover", Enabled: true, ContextWindow: 128000, MaxOutputTokens: 32000, Members: []config.ModelGroupMemberConfig{
          \t\t\t\t{ModelID: "economy", Priority: 1, Weight: 1, Enabled: true},
          \t\t\t\t{ModelID: "flagship", Priority: 2, Weight: 1, Enabled: true},
          \t\t\t}},
          \t\t},
          \t\tKeys: []config.KeyConfig{
          \t\t\t{ID: "economy-key", ProviderID: "provider", ModelID: "economy", Value: "economy-secret", Status: "active", Priority: 1},
          \t\t\t{ID: "flagship-key", ProviderID: "provider", ModelID: "flagship", Value: "flagship-secret", Status: "active", Priority: 1},
          \t\t},
          \t}
          }

          func TestGroupRoutingFiltersIncompatibleModelsAndSetsHeaders(t *testing.T) {
          \tvar selectedModel string
          \tupstream := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {
          \t\tvar payload struct{ Model string `json:"model"` }
          \t\tif err := json.NewDecoder(r.Body).Decode(&payload); err != nil {
          \t\t\tt.Fatal(err)
          \t\t}
          \t\tselectedModel = payload.Model
          \t\tw.Header().Set("Content-Type", "application/json")
          \t\t_, _ = w.Write([]byte(`{"choices":[{"message":{"role":"assistant","content":"ok"}}]}`))
          \t}))
          \tdefer upstream.Close()

          \trouter, err := NewRouterService(groupFeatureConfig(upstream.URL + "/v1"))
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \treq := httptest.NewRequest(http.MethodPost, "/v1/chat/completions", strings.NewReader(`{"model":"coding-balanced","messages":[],"tools":[{"type":"function","function":{"name":"read_file"}}]}`))
          \tresp, err := router.HandleChatCompletion(context.Background(), req)
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          \tdefer resp.Body.Close()

          \tif selectedModel != "flagship-upstream" {
          \t\tt.Fatalf("expected compatible flagship model, got %q", selectedModel)
          \t}
          \tfor header, want := range map[string]string{
          \t\t"X-ModelMux-Requested-Model":  "coding-balanced",
