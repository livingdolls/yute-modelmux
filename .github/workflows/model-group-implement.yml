              \t}
              \tfor _, g := range groups {
              \t\tif !g.Enabled {
              \t\t\tcontinue
              \t\t}
              \t\titems = append(items, modelItem{ID: g.ID, Object: "model"})
              \t}
              \twriteJSON(w, http.StatusOK, map[string]any{"object": "list", "data": items})
              }
              '''),
              dedent('''\
              func (s *Server) modelsHandler(w http.ResponseWriter, r *http.Request) {
              \trs := s.routerServiceForRequest(r)
              \tmodels := rs.ListModels()
              \tgroups := rs.ListModelGroups()
              \titems := make([]modelListItem, 0, len(models)+len(groups))
              \tfor _, model := range models {
