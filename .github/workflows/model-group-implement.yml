          Path("internal/app/service/model_group_routing.go").write_text(dedent('''\
          package service

          import (
          \t"encoding/json"
          \t"fmt"
          \t"hash/fnv"
          \t"net/http"
          \t"sort"
          \t"strconv"
          \t"strings"

          \t"github.com/livingdolls/yute-modelmux/internal/core/domain"
          )

          func (s *RouterService) selectGroupMemberForRequest(groupID string, attempted map[string]struct{}, apiPath string, bodyBytes []byte, stickyKey string) (domain.ModelGroupMember, domain.Model, bool) {
          \ts.mu.Lock()
          \tdefer s.mu.Unlock()

          \tgroup, ok := s.groupByID(groupID)
          \tif !ok || !group.Enabled {
          \t\treturn domain.ModelGroupMember{}, domain.Model{}, false
          \t}

          \tavailable := s.availableGroupMembers(group, attempted)
          \tmembers := make([]availableGroupMember, 0, len(available))
          \tfor _, candidate := range available {
          \t\tif err := s.checkModelCapability(candidate.model, apiPath, bodyBytes); err == nil {
          \t\t\tmembers = append(members, candidate)
          \t\t}
          \t}
          \tif len(members) == 0 {
          \t\treturn domain.ModelGroupMember{}, domain.Model{}, false
          \t}

          \tswitch group.Strategy {
          \tcase domain.GroupStrategyRoundRobin:
          \t\tidx := s.groupRRIndex[groupID] % len(members)
          \t\ts.groupRRIndex[groupID] = (idx + 1) % len(members)
          \t\treturn members[idx].member, members[idx].model, true
          \tcase domain.GroupStrategyWeighted:
          \t\tselected := s.selectWeightedMember(members)
          \t\treturn selected.member, selected.model, true
          \tcase domain.GroupStrategyConsistentHash:
          \t\tif stickyKey != "" {
          \t\t\tselected := selectRendezvousMember(members, stickyKey)
          \t\t\treturn selected.member, selected.model, true
          \t\t}
          \t\tfallthrough
          \tdefault:
          \t\tsortGroupMembersByPriority(members)
          \t\treturn members[0].member, members[0].model, true
          \t}
          }

          func sortGroupMembersByPriority(members []availableGroupMember) {
          \tsort.SliceStable(members, func(i, j int) bool {
          \t\tif members[i].member.Priority != members[j].member.Priority {
          \t\t\treturn members[i].member.Priority < members[j].member.Priority
          \t\t}
          \t\treturn groupMemberAttemptKey(members[i].member) < groupMemberAttemptKey(members[j].member)
          \t})
          }

          func selectRendezvousMember(members []availableGroupMember, stickyKey string) availableGroupMember {
          \tselected := members[0]
          \tselectedKey := groupMemberAttemptKey(selected.member)
          \tbestScore := rendezvousScore(stickyKey, selectedKey)
          \tfor _, candidate := range members[1:] {
          \t\tcandidateKey := groupMemberAttemptKey(candidate.member)
          \t\tscore := rendezvousScore(stickyKey, candidateKey)
          \t\tif score > bestScore || (score == bestScore && candidateKey < selectedKey) {
          \t\t\tselected = candidate
          \t\t\tselectedKey = candidateKey
          \t\t\tbestScore = score
          \t\t}
          \t}
          \treturn selected
          }

          func rendezvousScore(stickyKey, memberKey string) uint64 {
          \th := fnv.New64a()
          \t_, _ = h.Write([]byte(stickyKey))
          \t_, _ = h.Write([]byte{0})
          \t_, _ = h.Write([]byte(memberKey))
          \treturn h.Sum64()
          }

          func groupStickyKey(req *http.Request, bodyBytes []byte) string {
          \tif req != nil {
          \t\tfor _, header := range []string{"X-ModelMux-Session-ID", "X-OpenAI-User", "OpenAI-User"} {
          \t\t\tif value := strings.TrimSpace(req.Header.Get(header)); value != "" {
          \t\t\t\treturn value
          \t\t\t}
          \t\t}
          \t}

          \tvar payload struct {
          \t\tUser     string         `json:"user"`
          \t\tMetadata map[string]any `json:"metadata"`
          \t}
          \tif err := json.Unmarshal(bodyBytes, &payload); err != nil {
          \t\treturn ""
          \t}
          \tif value := strings.TrimSpace(payload.User); value != "" {
          \t\treturn value
          \t}
          \tfor _, key := range []string{"session_id", "conversation_id", "thread_id"} {
          \t\tif value, ok := payload.Metadata[key].(string); ok {
          \t\t\tif value = strings.TrimSpace(value); value != "" {
          \t\t\t\treturn value
          \t\t\t}
          \t\t}
          \t}
          \treturn ""
          }

          func (s *RouterService) checkGroupCapability(group domain.ModelGroup, apiPath string, bodyBytes []byte) error {
          \ts.mu.Lock()
          \tdefer s.mu.Unlock()

          \tconfiguredMembers := 0
          \tfor _, member := range group.Members {
          \t\tif !member.Enabled {
          \t\t\tcontinue
          \t\t}
          \t\tmodel, ok := s.modelForGroupMemberLocked(member)
          \t\tif !ok || !model.Enabled {
          \t\t\tcontinue
          \t\t}
          \t\tconfiguredMembers++
          \t\tif err := s.checkModelCapability(model, apiPath, bodyBytes); err == nil {
          \t\t\treturn nil
          \t\t}
          \t}
          \tif configuredMembers == 0 {
          \t\treturn nil
          \t}
          \treturn &ProxyError{
          \t\tHTTPStatus: http.StatusBadRequest,
          \t\tType:       "modelmux_unsupported",
          \t\tCode:       "group_capability_mismatch",
          \t\tMessage:    fmt.Sprintf("model group %s has no member compatible with this request", group.ID),
          \t}
          }

          func (s *RouterService) modelForGroupMemberLocked(member domain.ModelGroupMember) (domain.Model, bool) {
          \tmodelID := member.ModelID
          \tif member.KeyID != "" {
          \t\tkey, ok := s.keyByID(member.KeyID)
          \t\tif !ok {
          \t\t\treturn domain.Model{}, false
          \t\t}
          \t\tmodelID = key.ModelID
          \t}
          \treturn s.modelByID(modelID)
          }

          func (s *RouterService) prepareModelGroups() error {
          \tfor i := range s.groups {
          \t\tgroup := &s.groups[i]
          \t\tgroup.Capabilities = s.groupCapabilitiesLocked(*group)
          \t\tif !group.Enabled {
          \t\t\tcontinue
          \t\t}

          \t\tresolvedMembers := 0
          \t\tfor _, member := range group.Members {
          \t\t\tif !member.Enabled {
          \t\t\t\tcontinue
          \t\t\t}
          \t\t\tmodel, ok := s.modelForGroupMemberLocked(member)
          \t\t\tif ok && model.Enabled {
          \t\t\t\tresolvedMembers++
          \t\t\t}
          \t\t}
          \t\tif resolvedMembers == 0 {
          \t\t\treturn fmt.Errorf("enabled model group %s has no enabled model members", group.ID)
          \t\t}
          \t\tfor _, capability := range group.RequiredCapabilities {
          \t\t\tif !capabilityEnabled(group.Capabilities, capability) {
          \t\t\t\treturn fmt.Errorf("model group %s requires capability %s but not every enabled member supports it", group.ID, capability)
          \t\t\t}
          \t\t}
          \t}
          \treturn nil
          }

          func (s *RouterService) groupCapabilitiesLocked(group domain.ModelGroup) domain.Capabilities {
          \tvar capabilities domain.Capabilities
          \tfound := false
          \tfor _, member := range group.Members {
          \t\tif !member.Enabled {
          \t\t\tcontinue
          \t\t}
          \t\tmodel, ok := s.modelForGroupMemberLocked(member)
          \t\tif !ok || !model.Enabled {
          \t\t\tcontinue
          \t\t}
          \t\tif !found {
          \t\t\tcapabilities = model.Capabilities
          \t\t\tfound = true
          \t\t\tcontinue
          \t\t}
          \t\tcapabilities.Chat = capabilities.Chat && model.Capabilities.Chat
          \t\tcapabilities.Completions = capabilities.Completions && model.Capabilities.Completions
          \t\tcapabilities.Streaming = capabilities.Streaming && model.Capabilities.Streaming
          \t\tcapabilities.Tools = capabilities.Tools && model.Capabilities.Tools
          \t\tcapabilities.Vision = capabilities.Vision && model.Capabilities.Vision
          \t\tcapabilities.JSONMode = capabilities.JSONMode && model.Capabilities.JSONMode
          \t}
          \treturn capabilities
          }

          func capabilityEnabled(capabilities domain.Capabilities, capability string) bool {
          \tswitch capability {
          \tcase "chat":
          \t\treturn capabilities.Chat
          \tcase "completions":
          \t\treturn capabilities.Completions
          \tcase "streaming":
          \t\treturn capabilities.Streaming
          \tcase "tools":
          \t\treturn capabilities.Tools
          \tcase "vision":
          \t\treturn capabilities.Vision
          \tcase "json_mode":
          \t\treturn capabilities.JSONMode
          \tdefault:
          \t\treturn false
          \t}
          }

          func setRoutingResponseHeaders(header http.Header, bodyBytes []byte, groupID, modelID, providerID string, attempt int) {
          \tif requestedID, err := extractModelFromBody(bodyBytes); err == nil {
          \t\theader.Set("X-ModelMux-Requested-Model", requestedID)
          \t}
          \theader.Set("X-ModelMux-Selected-Model", modelID)
          \theader.Set("X-ModelMux-Selected-Provider", providerID)
          \tif groupID != "" {
          \t\theader.Set("X-ModelMux-Group", groupID)
          \t}
          \tif attempt > 0 {
          \t\theader.Set("X-ModelMux-Attempt", strconv.Itoa(attempt))
          \t}
          }
          '''))

          replace(
              "internal/adapter/httpserver/handlers.go",
              dedent('''\
              func (s *Server) modelsHandler(w http.ResponseWriter, r *http.Request) {
              \ttype modelItem struct {
              \t\tID     string `json:"id"`
              \t\tObject string `json:"object"`
              \t}
              \trs := s.routerServiceForRequest(r)
              \tmodels := rs.ListModels()
