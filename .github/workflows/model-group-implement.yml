          package domain

          type GroupStrategy string

          const (
          \tGroupStrategyFailover       GroupStrategy = "failover"
          \tGroupStrategyRoundRobin     GroupStrategy = "round_robin"
          \tGroupStrategyWeighted       GroupStrategy = "weighted"
          \tGroupStrategyConsistentHash GroupStrategy = "consistent_hash"
          )

          type ModelGroup struct {
          \tID                   string
          \tName                 string
          \tDescription          string
