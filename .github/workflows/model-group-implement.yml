          replace(
              "internal/app/service/router_service.go",
              '\t\tgroup := domain.ModelGroup{ID: g.ID, Name: g.Name, Strategy: strategy, Enabled: g.Enabled}\n',
              '\t\tgroup := domain.ModelGroup{ID: g.ID, Name: g.Name, Description: g.Description, Strategy: strategy, Enabled: g.Enabled, RequiredCapabilities: append([]string(nil), g.RequiredCapabilities...), ContextWindow: g.ContextWindow, MaxOutputTokens: g.MaxOutputTokens}\n',
