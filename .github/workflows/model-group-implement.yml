          \t_, fallback, ok := router.selectGroupMemberForRequest("coding-balanced", map[string]struct{}{}, "/chat/completions", []byte(`{"messages":[]}`), "")
          \tif !ok || fallback.ID != "economy" {
          \t\tt.Fatalf("expected no-session fallback to priority member economy, got %+v", fallback)
          \t}
