              \tMembers  []ModelGroupMemberConfig `yaml:"members"`
              }
              '''),
              dedent('''\
              type ModelGroupConfig struct {
              \tID                   string                   `yaml:"id"`
              \tName                 string                   `yaml:"name"`
              \tDescription          string                   `yaml:"description,omitempty"`
              \tStrategy             string                   `yaml:"strategy"`
              \tEnabled              bool                     `yaml:"enabled"`
