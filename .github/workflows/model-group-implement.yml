          package service

          import (
          \t"context"
          \t"encoding/json"
          \t"errors"
          \t"net/http"
          \t"net/http/httptest"
          \t"strings"
          \t"testing"

          \t"github.com/livingdolls/yute-modelmux/internal/config"
          )

          func groupFeatureBool(value bool) *bool { return &value }

          func groupFeatureConfig(baseURL string) *config.Config {
          \treturn &config.Config{
          \t\tApp:      config.AppConfig{Name: "test", LogLevel: "info"},
          \t\tServer:   config.ServerConfig{Host: "127.0.0.1", Port: 8787},
          \t\tCooldown: config.CooldownConfig{RateLimitSeconds: 30, ServerErrorSeconds: 30, TimeoutSeconds: 30},
