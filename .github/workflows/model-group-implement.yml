          )

          replace(
              "internal/config/config.go",
              '\t\t\tvalidStrategies := map[string]bool{"failover": true, "round_robin": true, "weighted": true}\n\t\t\tif g.Strategy != "" && !validStrategies[g.Strategy] {\n\t\t\t\terrs = append(errs, "model group "+g.ID+" strategy "+g.Strategy+" is not valid; must be one of: failover, round_robin, weighted")\n\t\t\t}\n',
              '\t\t\tvalidStrategies := map[string]bool{"failover": true, "round_robin": true, "weighted": true, "consistent_hash": true}\n\t\t\tif g.Strategy != "" && !validStrategies[g.Strategy] {\n\t\t\t\terrs = append(errs, "model group "+g.ID+" strategy "+g.Strategy+" is not valid; must be one of: failover, round_robin, weighted, consistent_hash")\n\t\t\t}\n',
          )

          replace(
              "internal/config/config.go",
              '\t\tif len(g.Members) == 0 {\n',
              dedent('''\
              \t\tif g.ContextWindow < 0 {
              \t\t\terrs = append(errs, "model group "+g.ID+" context_window must be non-negative")
              \t\t}
              \t\tif g.MaxOutputTokens < 0 {
              \t\t\terrs = append(errs, "model group "+g.ID+" max_output_tokens must be non-negative")
              \t\t}
              \t\tvalidCapabilities := map[string]bool{
              \t\t\t"chat": true, "completions": true, "streaming": true,
              \t\t\t"tools": true, "vision": true, "json_mode": true,
              \t\t}
              \t\tfor _, capability := range g.RequiredCapabilities {
              \t\t\tif !validCapabilities[capability] {
              \t\t\t\terrs = append(errs, "model group "+g.ID+" required capability "+capability+" is not valid")
              \t\t\t}
              \t\t}
              \t\tif len(g.Members) == 0 {
              '''),
          )

