              \t}
              \twriteJSON(w, http.StatusOK, map[string]any{"object": "list", "data": items})
              }
              '''),
          )

          Path("internal/adapter/httpserver/model_listing.go").write_text(dedent('''\
          package httpserver

          import "github.com/livingdolls/yute-modelmux/internal/core/domain"

          type modelListCapabilities struct {
          \tChat        bool `json:"chat"`
          \tCompletions bool `json:"completions"`
          \tStreaming   bool `json:"streaming"`
          \tTools       bool `json:"tools"`
          \tVision      bool `json:"vision"`
          \tJSONMode    bool `json:"json_mode"`
          }

          type modelListItem struct {
          \tID                   string                `json:"id"`
          \tObject               string                `json:"object"`
          \tOwnedBy              string                `json:"owned_by"`
          \tModelMuxType         string                `json:"modelmux_type"`
          \tName                 string                `json:"name,omitempty"`
          \tDescription          string                `json:"description,omitempty"`
          \tStrategy             string                `json:"strategy,omitempty"`
          \tCapabilities         modelListCapabilities `json:"capabilities"`
          \tRequiredCapabilities []string              `json:"required_capabilities,omitempty"`
          \tContextWindow        int                   `json:"context_window,omitempty"`
          \tMaxOutputTokens      int                   `json:"max_output_tokens,omitempty"`
          \tMembers              int                   `json:"members,omitempty"`
          }

          func modelListCapabilitiesFromDomain(capabilities domain.Capabilities) modelListCapabilities {
          \treturn modelListCapabilities{
          \t\tChat: capabilities.Chat, Completions: capabilities.Completions,
          \t\tStreaming: capabilities.Streaming, Tools: capabilities.Tools,
          \t\tVision: capabilities.Vision, JSONMode: capabilities.JSONMode,
          \t}
          }

          func modelListItemFromModel(model domain.Model) modelListItem {
          \treturn modelListItem{
          \t\tID: model.ID, Object: "model", OwnedBy: model.ProviderID,
          \t\tModelMuxType: "model", Name: model.ID,
          \t\tCapabilities: modelListCapabilitiesFromDomain(model.Capabilities),
          \t}
          }

          func modelListItemFromGroup(group domain.ModelGroup) modelListItem {
          \treturn modelListItem{
          \t\tID: group.ID, Object: "model", OwnedBy: "modelmux",
          \t\tModelMuxType: "group", Name: group.Name, Description: group.Description,
          \t\tStrategy: string(group.Strategy),
          \t\tCapabilities: modelListCapabilitiesFromDomain(group.Capabilities),
          \t\tRequiredCapabilities: append([]string(nil), group.RequiredCapabilities...),
          \t\tContextWindow: group.ContextWindow, MaxOutputTokens: group.MaxOutputTokens,
          \t\tMembers: len(group.Members),
          \t}
          }
          '''))

