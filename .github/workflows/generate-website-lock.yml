name: Generate website lockfile

on:
  push:
    branches:
      - agent/fix-audit-findings
    paths:
      - .github/workflows/generate-website-lock.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-audit-findings
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate lockfile
        working-directory: website
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile and remove bootstrap workflow
        run: |
          rm .github/workflows/generate-website-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/package-lock.json .github/workflows/generate-website-lock.yml
          git diff --cached --check
          git commit -m "chore: add deterministic website lockfile"
          git push origin HEAD:agent/fix-audit-findings
