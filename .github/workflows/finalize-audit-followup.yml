name: Finalize audit follow-up

on:
  push:
    branches:
      - agent/fix-audit-findings-clean
    paths:
      - audit-followup.patch
      - .github/workflows/finalize-audit-followup.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-audit-findings-clean
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Apply follow-up patch
        run: |
          set +e
          git apply --recount --verbose audit-followup.patch > audit-followup.log 2>&1
          status=$?
          set -e
          cat audit-followup.log
          exit "$status"

      - name: Publish failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Audit follow-up diagnostics'
            echo
            echo '```text'
            if test -f audit-followup.log; then cat audit-followup.log; else echo 'Failure occurred after patch application. Inspect the Actions run for details.'; fi
            echo '```'
          } > audit-followup-comment.md
          gh pr comment 11 --body-file audit-followup-comment.md

      - name: Format Go sources
        run: gofmt -w cmd/modelmux/main.go internal/app/service/router_service.go internal/app/service/storage_health_test.go

      - name: Unit and race tests
        run: go test -race ./...

      - name: End-to-end tests
        run: go test -race -tags=e2e ./internal/e2e/ -timeout 60s

      - name: Vet
        run: go vet ./...

      - name: Validate website
        working-directory: website
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit validated follow-up
        run: |
          rm -f audit-followup.patch audit-followup.log audit-followup-comment.md .github/workflows/finalize-audit-followup.yml website/tsconfig.tsbuildinfo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce storage health in core routing"
          git push origin HEAD:agent/fix-audit-findings-clean
