name: Apply audit fixes

on:
  push:
    branches:
      - agent/fix-audit-findings
    paths:
      - scripts/apply_audit_fixes.py
      - .github/workflows/apply-audit-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-audit-findings
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package.json

      - name: Apply deterministic patch
        run: python3 scripts/apply_audit_fixes.py

      - name: Format Go sources
        run: gofmt -w cmd internal

      - name: Vet
        run: go vet ./...

      - name: Unit and race tests
        run: go test -race ./...

      - name: HTTP E2E tests
        run: go test -race -tags=e2e ./internal/e2e/ -timeout 60s

      - name: Verify website
        working-directory: website
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Ensure bootstrap removed
        run: |
          test ! -e scripts/apply_audit_fixes.py
          test ! -e .github/workflows/apply-audit-fixes.yml

      - name: Commit verified remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: address repository audit findings"
          git push origin HEAD:agent/fix-audit-findings
