name: Finalize audit fixes

on:
  push:
    branches:
      - agent/fix-audit-findings
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-audit-fixes
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/fix-audit-findings' || github.ref_name == 'agent/fix-audit-findings'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-audit-findings
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply reviewed patch
        run: |
          sed -i 's#internal/app/service/router.go#internal/app/service/router_service.go#g' audit-existing.patch
          set +e
          patch --batch --forward -p1 < audit-existing.patch > audit-apply.log 2>&1
          status=$?
          set -e
          cat audit-apply.log
          exit "$status"

      - name: Publish patch failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Audit patch diagnostics'
            echo
            echo '```text'
            cat audit-apply.log
            echo '```'
          } > audit-comment.md
          gh pr comment 10 --body-file audit-comment.md

      - name: Format changed Go files
        run: |
          gofmt -w \
            cmd/modelmux/main.go \
            cmd/modelmux/network.go \
            cmd/modelmux/network_test.go \
            internal/config/paths.go \
            internal/config/paths_test.go \
            internal/secret/atomic.go \
            internal/secret/store.go \
            internal/secret/store_test.go \
            internal/storage/health.go \
            internal/storage/health_test.go \
            internal/storage/storage.go \
            internal/adapter/httpserver/server.go \
            internal/adapter/httpserver/handlers.go \
            internal/adapter/httpserver/storage_health_test.go \
            internal/app/service/router_service.go \
            internal/app/service/response_buffer.go \
            internal/app/service/response_buffer_test.go

      - name: Generate deterministic website lockfile
        working-directory: website
        run: npm install --package-lock-only --ignore-scripts

      - name: Run Go unit and race tests
        run: go test -race ./...

      - name: Run Go end-to-end tests
        run: go test -race -tags=e2e ./internal/e2e/ -timeout 60s

      - name: Run Go vet
        run: go vet ./...

      - name: Validate website
        working-directory: website
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit validated fixes
        run: |
          rm -f \
            audit-existing.patch \
            audit-apply.log \
            audit-comment.md \
            .github/workflows/bootstrap-audit-fixes.yml \
            .github/workflows/apply-audit-fixes.yml \
            scripts/apply_audit_fixes.py \
            internal/secret/secret.go \
            internal/secret/secret_test.go \
            .audit-trigger \
            .audit-trigger-2 \
            .audit-trigger-3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: address repository audit findings"
          git push origin HEAD:agent/fix-audit-findings
