name: Finalize audit fixes

on:
  push:
    branches:
      - agent/fix-audit-findings-clean
    paths:
      - audit-existing.patch
      - .github/workflows/finalize-audit-fixes.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean remediation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-audit-findings-clean
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply reviewed patch
        run: |
          sed -i \
            -e 's#internal/secret/store.go#internal/secret/secret.go#g' \
            -e 's#internal/secret/store_test.go#internal/secret/secret_test.go#g' \
            audit-existing.patch
          sed -i '/^diff --git a\/.github\/workflows\/release.yml/,$d' audit-existing.patch
          set +e
          git apply --recount --verbose audit-existing.patch > audit-apply.log 2>&1
          status=$?
          set -e
          cat audit-apply.log
          exit "$status"

      - name: Publish failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Audit finalization diagnostics'
            echo
            echo '```text'
            if test -f audit-apply.log; then cat audit-apply.log; else echo 'Failure occurred after patch application. Inspect the Actions run for details.'; fi
            echo '```'
          } > audit-comment.md
          gh pr comment 11 --body-file audit-comment.md

      - name: Format changed Go files
        run: |
          gofmt -w \
            cmd/modelmux/main.go \
            cmd/modelmux/network.go \
            cmd/modelmux/network_test.go \
            internal/config/paths.go \
            internal/config/paths_test.go \
            internal/secret/atomic.go \
            internal/secret/secret.go \
            internal/secret/secret_test.go \
            internal/storage/health.go \
            internal/storage/health_test.go \
            internal/storage/storage.go \
            internal/adapter/httpserver/server.go \
            internal/adapter/httpserver/handlers.go \
            internal/adapter/httpserver/storage_health_test.go \
            internal/app/service/router_service.go \
            internal/app/service/response_buffer.go \
            internal/app/service/response_buffer_test.go

      - name: Generate deterministic website lockfile
        working-directory: website
        run: npm install --package-lock-only --ignore-scripts

      - name: Unit and race tests
        run: go test -race ./...

      - name: End-to-end tests
        run: go test -race -tags=e2e ./internal/e2e/ -timeout 60s

      - name: Vet
        run: go vet ./...

      - name: Validate website
        working-directory: website
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit validated remediation
        run: |
          rm -f audit-existing.patch audit-apply.log audit-comment.md .github/workflows/finalize-audit-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: address repository audit findings"
          git push origin HEAD:agent/fix-audit-findings-clean
